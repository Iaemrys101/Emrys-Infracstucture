name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build website image
        run: |
          docker build \
            -f Novohearth-Homes-site/dockerfile \
            -t novohearth-site:ci \
            Novohearth-Homes-site

      - name: Check Nginx configuration
        run: docker run --rm novohearth-site:ci nginx -t