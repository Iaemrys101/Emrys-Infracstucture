name: Website Deploy

on:
  push:
    branches: [main]
    paths:
      - "Novohearth-Homes-site/**"
      - ".github/workflows/website-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: website-production
  cancel-in-progress: false

env:
  ACR_NAME: nimbusacrivqmz
  IMAGE_NAME: nimbusacrivqmz.azurecr.io/novohearth-homes-site
  RESOURCE_GROUP: nimbus-rg
  AKS_CLUSTER: nimbus-aks
  AZURE_CORE_OUTPUT: none

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build website image
        run: |
          docker build \
            -f Novohearth-Homes-site/dockerfile \
            -t "$IMAGE_NAME:$GITHUB_SHA" \
            Novohearth-Homes-site

      - name: Check Nginx configuration
        run: docker run --rm "$IMAGE_NAME:$GITHUB_SHA" nginx -t

      - name: Test website response
        run: |
          docker run -d --name website-test \
            -p 127.0.0.1:8080:80 "$IMAGE_NAME:$GITHUB_SHA"
          trap 'docker rm -f website-test' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8080/ -o /tmp/homepage.html
          test -s /tmp/homepage.html

      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ fromJSON(secrets.AZURECREDENTIALS).clientId }}
          tenant-id: ${{ fromJSON(secrets.AZURECREDENTIALS).tenantId }}
          subscription-id: ${{ fromJSON(secrets.AZURECREDENTIALS).subscriptionId }}

      - name: Push image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Install Kubernetes tools
        run: |
          K8S_VERSION=$(az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --query kubernetesVersion -o tsv)
          az aks install-cli \
            --client-version "$K8S_VERSION" \
            --install-location "$RUNNER_TEMP/kubectl" \
            --kubelogin-install-location "$RUNNER_TEMP/kubelogin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Deploy and verify rollout
        run: |
          kubectl set image deployment/novohearth-homes-site \
            web="$IMAGE_NAME:$GITHUB_SHA" -n default
          kubectl rollout status deployment/novohearth-homes-site \
            -n default --timeout=300s