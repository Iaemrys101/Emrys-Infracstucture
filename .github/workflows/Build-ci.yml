name: CI/CD to AKS
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        # Public identifiers for the existing GitHub OIDC identity.
        client-id: ba3ad5f5-1183-4fb4-b29d-2e658d5b3dbc
        tenant-id: e3ec2f73-0d86-485d-b4aa-bfac95aa8803
        subscription-id: 895f6afd-c1e3-4c48-a6d4-b2528ea3d817

    - name: Azure CLI version
      run: az version 
    - name: Login to ACR
      run: az acr login --name nimbusacrivqmz

    - name: Build Docker Image
      run: |
          IMAGE=${{ secrets.AZURECONTAINERREGISTRY }}/novohearth-homes-site:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE ./Novohearth-Homes-site

    - name: Push Docker Image to ACR
      run: docker push ${{ env.IMAGE }}  

    - name: Install kubelogin
      run: az aks install-cli
    
    - name: Get AKS Credentials
      run: |
          az aks get-credentials --resource-group ${{ secrets.AZURERESOURCEGROUP }} --name ${{ secrets.AZURECLUSTERNAME }}
          kubelogin convert-kubeconfig -l azurecli
    
          

    - name: Deploy to AKS
      run: |
         kubectl --namespace default set image deployment/novohearth-homes-site web=${{ env.IMAGE }}
         kubectl --namespace default rollout status deployment/novohearth-homes-site --timeout=300s


          


      
      